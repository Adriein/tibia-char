services:
  tibia_char_database:
    container_name: tibia_char_database
    image: postgres:15-alpine
    user: ${DATABASE_USER}
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - tibia_char_database_data:/var/lib/postgresql/data:rw

  tibia_char_server:
    image: "${IMAGE_NAME}:${IMAGE_VERSION}"
    environment:
      DATABASE_NAME: "${DATABASE_NAME}"
      DATABASE_USER: "${DATABASE_USER}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
      SERVER_PORT: "${SERVER_PORT}"
      ENV: "${ENV}"
      POSTHOG_SDK_API_KEY: "${POSTHOG_SDK_API_KEY}"
    depends_on:
      tibia_char_database:
        condition: service_healthy

  tibia_char_reverse_proxy:
    container_name: tibia_char_reverse_proxy
    image: caddy:2.11-alpine
    environment:
      SERVER_PORT: "${SERVER_PORT}"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tibia_char_server

volumes:
  tibia_char_database_data:
  caddy_data:
  caddy_config:
---
- name: Bootstrap server (first-time SSH key setup)
  hosts: all
  gather_facts: false
  roles:
    - bootstrap
  tags:
    - bootstrap

- name: Pre-flight checks
  hosts: all
  gather_facts: true
  become: true
  roles:
    - pre-flight
  tags:
    - always

- name: Setup server tools
  hosts: all
  become: true
  roles:
    - setup-nvim
  tags:
    - setup

- name: Tibia-Char localhost create artifact
  hosts: localhost
  roles:
    - tibia-char-zip
  tags:
    - build
    - deploy
    - full
TODO: the order of zip and uilb is hectic i don't understand how this can possibily work
TODO: make sure all tmp directories get cleaned up because i don't think they are right now
- name: Deploy tibia-char to hosts
  hosts: all
  become: true
  roles:
    - docker-install
    - build
    - env
    - run
    - migrations
    - health-check
    - cleanup
  environment: &deploy_env
    DATABASE_URL: "{{ database_url }}"
    DATABASE_NAME: "{{ database_name }}"
    DATABASE_USER: "{{ database_user }}"
    DATABASE_PASSWORD: "{{ database_password }}"
    SERVER_PORT: "{{ server_port }}"
    ENV: "{{ env }}"
    API_URL: "{{ api_url }}"
    API_PROTOCOL: "{{ api_protocol }}"
  tags:
    - deploy
    - full

- name: Update config only (no rebuild)
  hosts: all
  become: true
  roles:
    - env
    - run
    - health-check
  environment: *deploy_env
  tags:
    - config
    - restart

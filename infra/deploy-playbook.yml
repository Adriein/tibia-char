---
- name: Setup server tools
  hosts: all
  become: true
  roles:
    - setup-nvim
  tags:
    - bootstrap

- name: Pre-flight checks
  hosts: all
  gather_facts: true
  become: true
  roles:
    - pre-flight
  tags:
    - preflight
    - deploy
    - full

- name: Tibia-Char localhost create artifact
  hosts: localhost
  vars_prompt:
    - name: artifact_version
      prompt: "Please enter the version of the artifact to build"
      private: false
      default: "1.0.0"
  roles:
    - build
  tags:
    - build
    - deploy
    - full

- name: Deploy tibia-char to hosts
  hosts: all
  become: true
  roles:
    - docker-install
    - deploy
    - env
    - run
    - migrations
    - health-check
    - cleanup
  environment: &deploy_env
    DATABASE_URL: "{{ database_url }}"
    DATABASE_NAME: "{{ database_name }}"
    DATABASE_USER: "{{ database_user }}"
    DATABASE_PASSWORD: "{{ database_password }}"
    SERVER_PORT: "{{ server_port }}"
    ENV: "{{ env }}"
    API_URL: "{{ api_url }}"
    API_PROTOCOL: "{{ api_protocol }}"
  tags:
    - deploy
    - full

- name: Update config only (no rebuild)
  hosts: all
  become: true
  roles:
    - env
    - run
    - health-check
  environment: *deploy_env
  tags:
    - config
    - restart

---
- name: Import shared vars
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/shared/main.yml"
    name: shared

- name: Ensure local backup directory exists
  ansible.builtin.file:
    path: "{{ shared.local_backup_artifact_folder }}"
    state: directory
    mode: '0755'
  tags:
    - build

- name: Ensure local temporary build directory is clean and exists
  ansible.builtin.file:
    path: "{{ shared.local_tmp_build_folder }}"
    state: "{{ item }}"
  loop:
    - absent
    - directory
  tags:
    - build

- name: Copy Dockerfile to build directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../Dockerfile"
    dest: "{{ shared.local_tmp_build_folder }}/Dockerfile"
    mode: '0644'
  tags:
    - build

- name: Copy Caddyfile to build directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/reverse_proxy/Caddyfile"
    dest: "{{ shared.local_tmp_build_folder }}/Caddyfile"
    mode: '0644'
  tags:
    - build

- name: Copy docker-compose.yaml to build directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose-pro.yaml"
    dest: "{{ shared.local_tmp_build_folder }}/docker-compose.yaml"
    mode: '0644'
  tags:
    - build

- name: Copy migrations directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/database/migrations"
    dest: "{{ shared.local_tmp_build_folder }}"
    mode: '0644'
  tags:
    - build

- name: Copy app directory to build directory
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../app/"
    dest: "{{ shared.local_tmp_build_folder }}/app/"
    rsync_opts:
      - "--exclude=migrate"
      - "--exclude=node_modules"
      - "--exclude=.env*"
  tags:
    - build

- name: Compress tibia-char app to backup directory with version prefix
  community.general.archive:
    path: "{{ shared.local_tmp_build_folder }}/*"
    dest: "{{ shared.local_backup_artifact_folder }}/{{ artifact_version }}-{{ shared.tibia_char_artifact }}{{ shared.archive_extension }}"
    format: gz
  tags:
    - build

- name: Copy artifact to temporary build folder
  ansible.builtin.copy:
    src: "{{ shared.local_backup_artifact_folder }}/{{ artifact_version }}-{{ shared.tibia_char_artifact }}{{ shared.archive_extension }}"
    dest: "{{ shared.local_tmp_build_folder }}/{{ artifact_version }}-{{ shared.tibia_char_artifact }}{{ shared.archive_extension }}"
    mode: '0644'
  tags:
    - build

- name: Find all files and folders inside the temporary build directory
  ansible.builtin.find:
    paths: "{{ shared.local_tmp_build_folder }}"
    recurse: false
    file_type: any
  register: files_in_tmp_build
  tags:
    - build

- name: Delete everything except the specific versioned artifact
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ files_in_tmp_build.files }}"
  when: item.path != (shared.local_tmp_build_folder ~ '/' ~ artifact_version ~ '-' ~ shared.tibia_char_artifact ~ shared.archive_extension)
  tags:
    - build
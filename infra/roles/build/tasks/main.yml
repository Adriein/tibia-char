---
- name: Import shared vars
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/shared/main.yml"
    name: shared

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - database_url is defined and database_url != ''
      - database_name is defined and database_name != ''
      - database_user is defined and database_user != ''
      - database_password is defined and database_password != ''
      - server_port is defined and server_port != ''
      - api_url is defined and api_url != ''
      - api_protocol is defined and api_protocol != ''
    fail_msg: "Missing required vault variable: {{ item }}"
    success_msg: "All required variables are set"
  tags:
    - always
    - validate

- name: Check if an existing deployment folder exists
  ansible.builtin.stat:
    path: "{{ shared.local_tmp_build_folder }}"
  register: existing_deploy
  tags:
    - build

- name: Clear out the old backup directory if it exists
  ansible.builtin.file:
    path: "{{ shared.local_backup_artifact_folder }}"
    state: absent
  when: existing_deploy.stat.exists and existing_deploy.stat.isdir
  tags:
    - build

- name: Create backup of current deployment
  ansible.builtin.command: "cp -rp {{ shared.deploy_path }} {{ shared.backup_path }}"
  changed_when: true
  when: existing_deploy.stat.exists and existing_deploy.stat.isdir
  tags:
    - build

- name: Ensure local temporary build directory is clean and exists
  ansible.builtin.file:
    path: "{{ shared.local_tmp_build_folder }}"
    state: "{{ item }}"
  loop:
    - absent
    - directory
  tags:
    - build

- name: Compile Go application binary for the target server
  ansible.builtin.command: "go build -o {{ shared. }}/tibia-char-server"
  args:
    chdir: "{{ playbook_dir }}/.." # Assumes your Go code is one folder up from your ansible directory
  environment:
    GOOS: linux
    GOARCH: amd64
    CGO_ENABLED: "0"
  tags:
    - build

- name: Zip tibia-char app
  community.general.archive:
    path: "{{ shared.local_tmp_build_folder }}/*"
    dest: "{{ local_tmp_build_folder }}/{{ shared.tibia_char_artifact }}"
    exclusion_patterns:
      - "node_modules/*"
      - "migrate"
    mode: '0644'
  tags:
    - build

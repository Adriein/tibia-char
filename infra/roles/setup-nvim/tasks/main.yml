---
- name: Import shared vars
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/shared/main.yml"
    name: shared
  tags:
    - bootstrap

- name: Check if nvim is installed
  ansible.builtin.command: which nvim
  register: nvim_check
  changed_when: false
  failed_when: false
  tags:
    - bootstrap

- name: Install Neovim
  ansible.builtin.apt:
    name: neovim
    state: present
    update_cache: true
  when: nvim_check.rc != 0
  tags:
    - bootstrap

- name: Ensure Neovim config directory exists
  ansible.builtin.file:
    path: "{{ shared.remote_home_path }}/.config/nvim"
    state: directory
    owner: "{{ shared.remote_admin_user }}"
    group: "{{ shared.remote_admin_user }}"
    mode: '0755'
  tags:
    - bootstrap

- name: Create Neovim init.lua config
  ansible.builtin.copy:
    dest: "{{ shared.remote_home_path }}/.config/nvim/init.lua"
    content: |
      -- Essential server settings
      vim.opt.number = true          -- Show line numbers
      vim.opt.relativenumber = true  -- Relative line numbers for fast jumping
      vim.opt.mouse = 'a'            -- Allow mouse scrolling/clicking in terminal
      vim.opt.ignorecase = true      -- Case-insensitive searching
      vim.opt.smartcase = true       -- Smart case searching

      -- Indentation defaults (Great for YAML/Ansible)
      vim.opt.tabstop = 2            -- 1 tab = 2 spaces
      vim.opt.shiftwidth = 2         -- Shift by 2 spaces
      vim.opt.expandtab = true       -- Use spaces instead of tabs
    owner: "{{ shared.remote_admin_user }}"
    group: "{{ shared.remote_admin_user }}"
    mode: '0644'
  tags:
    - bootstrap

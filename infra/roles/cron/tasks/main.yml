---
- name: Import shared vars
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/shared/main.yml"
    name: shared

- name: Cron - Scrap stored links every 5 min
  ansible.builtin.cron:
    name: "tibia-char scrapper"
    minute: "*/5"
    hour: "0-10,12-23"
    job: >-
      flock -n /var/run/tibia_scrapper.lock -c "docker run --rm --network tibia_network
      -e DATABASE_URL={{ database_url }}
      -e POSTHOG_SDK_API_KEY={{ posthog_sdk_api_key }}
      -e SERVER_PORT={{ server_port }}
      -e ENV={{ env }}
      {{ shared.tibia_char_artifact }}:{{ artifact_version }}
      ./tibia-char scrapper"
    user: "{{ shared.remote_admin_user }}"
  tags:
    - cron
    - deploy
    - full

- name: Cron - Ingest new auctions once a day
  ansible.builtin.cron:
    name: "tibia-char ingestion"
    minute: "0"
    hour: "11"
    job: >-
      flock -n /var/run/tibia_scrapper.lock -c "docker run --rm --network tibia_network
      -e DATABASE_URL={{ database_url }}
      -e POSTHOG_SDK_API_KEY={{ posthog_sdk_api_key }}
      -e SERVER_PORT={{ server_port }}
      -e ENV={{ env }}
      {{ shared.tibia_char_artifact }}:{{ artifact_version }}
      ./tibia-char ingestion"
    user: "{{ shared.remote_admin_user }}"
  tags:
    - cron
    - deploy
    - full

- name: Cron - Update currency rate exchange once a day
  ansible.builtin.cron:
    name: "tibia-char currency"
    minute: "0"
    hour: "1"
    job: >-
      docker run --rm --network tibia_network
      -e DATABASE_URL={{ database_url }}
      -e POSTHOG_SDK_API_KEY={{ posthog_sdk_api_key }}
      -e SERVER_PORT={{ server_port }}
      -e ENV={{ env }}
      {{ shared.tibia_char_artifact }}:{{ artifact_version }}
      ./tibia-char currency
    user: "{{ shared.remote_admin_user }}"
  tags:
    - cron
    - deploy
    - full

- name: Cron - Update stats aggregation once a day
  ansible.builtin.cron:
    name: "tibia-char stats"
    minute: "0"
    hour: "1"
    job: >-
      docker run --rm --network tibia_network
      -e DATABASE_URL={{ database_url }}
      -e POSTHOG_SDK_API_KEY={{ posthog_sdk_api_key }}
      -e SERVER_PORT={{ server_port }}
      -e ENV={{ env }}
      {{ shared.tibia_char_artifact }}:{{ artifact_version }}
      ./tibia-char stats
    user: "{{ shared.remote_admin_user }}"
  tags:
    - cron
    - deploy
    - full
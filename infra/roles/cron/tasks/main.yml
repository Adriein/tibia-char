---
- name: Import shared vars
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/shared/main.yml"
    name: shared

- name: Cron - Scrap market every 5 min
  ansible.builtin.cron:
    name: "tibia-char update-prices"
    minute: "0"
    hour: "*"
    job: >-
      docker run --rm
      -e DATABASE_URL={{ database_url }}
      -e DATABASE_NAME={{ database_name }}
      -e DATABASE_USER={{ database_user }}
      -e DATABASE_HOST={{ database_host }}
      -e DATABASE_PASSWORD={{ database_password }}
      -e SERVER_PORT={{ server_port }}
      -e ENV={{ env }}
      {{ shared.tibia_char_artifact }}:{{ artifact_version }}
      ./tibia-char --scrapper
    user: "{{ shared.remote_admin_user }}"
  tags:
    - cron
    - deploy
    - full

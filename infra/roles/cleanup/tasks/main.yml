---
- name: Import shared vars
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/shared/main.yml"
    name: shared

- name: Remove migration tar archive if leftover
  ansible.builtin.file:
    path: "{{ shared.remote_home_path }}/migrate.linux-amd64.tar.gz"
    state: absent
  tags:
    - deploy
    - cleanup

- name: Ensure deploy_path is safe before deleting
  ansible.builtin.assert:
    that:
      - shared.deploy_path is defined
      - shared.deploy_path | length > 1
      - shared.deploy_path != '/'
    fail_msg: "shared.deploy_path is undefined or set to root! Aborting to prevent destructive delete."

- name: Remove deploy directory
  ansible.builtin.file:
    path: "{{ shared.deploy_path }}"
    state: absent
  tags:
    - deploy
    - cleanup

- name: Report cleanup completed
  ansible.builtin.debug:
    msg: "Cleanup finished - temporary files removed"
  tags:
    - deploy
    - cleanup

---
- name: Import shared vars
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/shared/main.yml"
    name: shared

- name: Run docker-compose down
  community.docker.docker_compose_v2:
    project_src: "{{ shared.deploy_path }}"
    state: absent
    env_files:
      - .env
  register: compose_down
  tags:
    - deploy
    - run

- name: Show docker compose down results
  ansible.builtin.debug:
    var: compose_down
  tags:
    - deploy
    - run

- name: Build Tibia Char Docker img
  community.docker.docker_image_build:
    name: "{{ shared.tibia_char_artifact }}:{{ artifact_version }}"
    path: "{{ shared.deploy_path }}"
    dockerfile: Dockerfile

- name: Run docker-compose up
  community.docker.docker_compose_v2:
    project_src: "{{ shared.deploy_path }}"
    state: present
    pull: missing
    build: always
    env_files:
      - .env
  register: compose_up
  tags:
    - deploy
    - run

- name: Show docker compose up results
  ansible.builtin.debug:
    var: compose_up
  tags:
    - deploy
    - run
